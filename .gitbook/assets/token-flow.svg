<svg viewBox="0 0 780 440" xmlns="http://www.w3.org/2000/svg" font-family="Georgia,'Times New Roman',serif">
<rect width="780" height="440" fill="#0E1326"/>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#D4AF37"/></marker></defs>
<text x="390" y="38" text-anchor="middle" fill="#EAECF5" font-size="20" font-weight="bold" letter-spacing="1">THE FLOW OF VALUE</text>
<text x="390" y="60" text-anchor="middle" fill="#9AA3C0" font-size="12.5" font-style="italic">value never leaves the Realm — it circulates</text>
<!-- nodes -->
<g font-size="13" font-weight="bold">
<rect x="320" y="84" width="140" height="48" rx="9" fill="#1A1130" stroke="#D4AF37" stroke-width="2"/><text x="390" y="113" text-anchor="middle" fill="#EAECF5">🔱 The Crown</text>
<rect x="318" y="170" width="144" height="46" rx="9" fill="#101A2E" stroke="#7C8AA8" stroke-width="1.6"/><text x="390" y="198" text-anchor="middle" fill="#EAECF5">Endowments</text>
<rect x="120" y="250" width="150" height="60" rx="9" fill="#161d22" stroke="#D4AF37" stroke-width="1.6"/><text x="195" y="275" text-anchor="middle" fill="#EAECF5" font-size="12.5">🛕🏛️🎰 Games</text><text x="195" y="294" text-anchor="middle" fill="#9AA3C0" font-size="10.5" font-weight="normal">emit OGG·OGC·OGF</text>
<rect x="510" y="250" width="150" height="60" rx="9" fill="#13201e" stroke="#37B6A4" stroke-width="1.6"/><text x="585" y="275" text-anchor="middle" fill="#EAECF5" font-size="12.5">Players</text><text x="585" y="294" text-anchor="middle" fill="#9AA3C0" font-size="10.5" font-weight="normal">mine · lock · bid · build</text>
<rect x="510" y="346" width="150" height="56" rx="9" fill="#22150f" stroke="#E0623D" stroke-width="1.6"/><text x="585" y="370" text-anchor="middle" fill="#EAECF5" font-size="12.5">Fees → Repurchase</text><text x="585" y="388" text-anchor="middle" fill="#9AA3C0" font-size="10.5" font-weight="normal">buy back · OGF burns</text>
<rect x="120" y="346" width="150" height="56" rx="9" fill="#101A2E" stroke="#37B6A4" stroke-width="1.6"/><text x="195" y="370" text-anchor="middle" fill="#EAECF5" font-size="12.5">💧 The Pools</text><text x="195" y="388" text-anchor="middle" fill="#9AA3C0" font-size="10.5" font-weight="normal">balance · rebalance</text>
</g>
