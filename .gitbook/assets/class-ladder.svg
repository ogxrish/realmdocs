<svg viewBox="0 0 760 560" xmlns="http://www.w3.org/2000/svg" font-family="Georgia,'Times New Roman',serif">
<rect width="760" height="560" fill="#0E1326"/>
<text x="380" y="40" text-anchor="middle" fill="#EAECF5" font-size="20" font-weight="bold" letter-spacing="1">THE CLASS LADDER</text>
<text x="380" y="62" text-anchor="middle" fill="#9AA3C0" font-size="12.5" font-style="italic">held LIQUID · the ladder mirrors the token ladder</text>
<!-- rungs: y, label, req, color, sealed? -->
<!-- Mad OG -->
<g>
<rect x="150" y="84" width="460" height="40" rx="7" fill="#1A1130" stroke="#D4AF37" stroke-width="2"/>
<text x="170" y="110" fill="#EAECF5" font-size="15" font-weight="bold">🔱 Mad OG</text>
<text x="590" y="110" text-anchor="end" fill="#D4AF37" font-size="12">Ruler — institutional weight</text></g>
<!-- Guardian sealed -->
<g><rect x="170" y="132" width="420" height="36" rx="7" fill="#12172a" stroke="#3A4570" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="188" y="155" fill="#9AA3C0" font-size="14" font-weight="bold">🔮 Guardian</text>
<text x="572" y="155" text-anchor="end" fill="#6B7699" font-size="11.5" font-style="italic">sealed · sworn to $OGR</text></g>
<!-- King sealed -->
<g><rect x="180" y="176" width="400" height="36" rx="7" fill="#12172a" stroke="#3A4570" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="198" y="199" fill="#9AA3C0" font-size="14" font-weight="bold">👑 King</text>
<text x="562" y="199" text-anchor="end" fill="#6B7699" font-size="11.5" font-style="italic">sealed · sworn to $OGM</text></g>
<!-- Noble -->
<g><rect x="190" y="220" width="380" height="38" rx="7" fill="#1a1030" stroke="#8B5CF6" stroke-width="1.8"/>
<text x="208" y="244" fill="#EAECF5" font-size="14" font-weight="bold">📚 Noble</text>
<text x="552" y="244" text-anchor="end" fill="#B96BE0" font-size="12">10,000 $OGA · 1% · ≤100 seats</text></g>
<!-- Knight -->
<g><rect x="200" y="266" width="360" height="38" rx="7" fill="#1c1622" stroke="#D4AF37" stroke-width="1.8"/>
<text x="218" y="290" fill="#EAECF5" font-size="14" font-weight="bold">🛡️ Knight</text>
<text x="542" y="290" text-anchor="end" fill="#D4AF37" font-size="11.5">1M OGG + 1B OGC + 1T OGF · ≤1,000</text></g>
<!-- Capital -->
<g><rect x="210" y="312" width="340" height="36" rx="7" fill="#161d22" stroke="#D4AF37" stroke-width="1.4"/>
<text x="228" y="335" fill="#EAECF5" font-size="13.5" font-weight="bold">💰 Capital</text>
<text x="532" y="335" text-anchor="end" fill="#C9A84A" font-size="11.5">1M $OGG · 0.1% · 1,000</text></g>
<!-- Builder -->
<g><rect x="220" y="356" width="320" height="36" rx="7" fill="#13201e" stroke="#37B6A4" stroke-width="1.4"/>
<text x="238" y="379" fill="#EAECF5" font-size="13.5" font-weight="bold">🧱 Builder</text>
<text x="522" y="379" text-anchor="end" fill="#37B6A4" font-size="11.5">1B $OGC · 0.1% · 1,000</text></g>
<!-- Degen -->
<g><rect x="230" y="400" width="300" height="36" rx="7" fill="#22150f" stroke="#E0623D" stroke-width="1.4"/>
<text x="248" y="423" fill="#EAECF5" font-size="13.5" font-weight="bold">🎲 Degen</text>
<text x="512" y="423" text-anchor="end" fill="#E0623D" font-size="11.5">1T $OGF · 0.1% · &lt;1,000 ↓</text></g>
<!-- OG -->
<g><rect x="240" y="444" width="280" height="38" rx="7" fill="#13201e" stroke="#37B6A4" stroke-width="1.8"/>
<text x="258" y="468" fill="#EAECF5" font-size="13.5" font-weight="bold">💎 OG</text>
<text x="502" y="468" text-anchor="end" fill="#37B6A4" font-size="11.5">100M $OGC · the Citizen floor</text></g>
<text x="380" y="512" text-anchor="middle" fill="#9AA3C0" font-size="11.5" font-style="italic">Noble ranks ABOVE Knight · staked tokens never count · class rolls with your liquid bag</text>
<text x="380" y="534" text-anchor="middle" fill="#6B7699" font-size="10.5">the tithe ascends ×10 per rung: 0.01% → 0.1% → 1% → (sealed)</text>
</svg>
